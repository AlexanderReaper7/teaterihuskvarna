# The e2e suite's own stack, loaded after compose.yaml and compose.dev.yaml by
# e2e/run.sh under the project name teaterihuskvarna-e2e, so it has its own
# database volume and never touches the dev stack: docs/decisions/0017.
#
# No proxy. Traefik finds apps through container labels on the whole docker
# host, so a second Traefik would see the dev app and the dev Traefik would see
# this one, both under the router name "app". The app is published directly
# instead, and its label keeps the dev Traefik away from it.

services:
  proxy:
    # Never started: no profile of this name is ever activated.
    profiles: [disabled]

  app:
    image: teaterihuskvarna:e2e
    environment:
      # application-dev.yaml builds login links and the passkey relying party
      # from http://localhost:${PROXY_HTTP_PORT}.
      PROXY_HTTP_PORT: "55556"
      # Back to production's per-address limit, so the suite can see it refuse.
      # The per-client limit stays at the dev profile's 200, since every
      # request in the suite comes from one address.
      TEATERIHUSKVARNA_LOGIN_REQUESTS_PER_ADDRESS: "5"
    labels:
      traefik.enable: "false"
    ports:
      - "127.0.0.1:55556:8080"

  db:
    # e2e/run.sh sets the database name, user and password, so none come from
    # the dev stack's .env.
    ports:
      # The suite reads and changes rows directly, to expire links and set up
      # administrators: e2e/support/db.ts.
      - "127.0.0.1:55433:5432"

  mail:
    labels:
      # Kept away from the dev Traefik, like the app above.
      traefik.enable: "false"
    ports: !override
      - "127.0.0.1:55025:8025"
