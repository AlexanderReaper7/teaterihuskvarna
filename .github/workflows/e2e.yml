# Runs the Playwright suite in e2e/ against its own stack, the same command a
# developer runs: docs/decisions/0017-playwright-e2e-in-docker.md.
#
# Only when started by hand, from the Actions tab or `gh workflow run e2e.yml`.
# A run builds the image and takes about three minutes, and some tests are
# timing-sensitive where the product is, so the user chose on 2026-09-23 not to
# run it on every push.
name: e2e

on:
  workflow_dispatch:

# Read the repository and nothing else. No job here writes to GitHub, so a
# compromised action gets a token that cannot push or change anything.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Playwright in Chromium and Firefox
        run: sh e2e/run.sh
      - name: Keep the report and the traces of failed tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
