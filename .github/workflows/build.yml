# Builds and tests the application. Everything runs through docker, so CI uses
# the same pinned JDK and PostgreSQL images a developer does:
# docs/decisions/0011-maven-and-the-build-in-a-container.md.
#
# Integration tests (*IT) run here rather than inside the image build, because
# Testcontainers needs a docker daemon and a build stage has none.
#
# `verify` is also what runs SpotBugs and PMD. Checkstyle is bound to `validate`,
# so the image job below runs that one too:
# docs/decisions/0013-three-static-analysis-gates.md.
name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tests and the three static analysis gates
        run: |
          docker run --rm --network host \
            -v "$PWD":/w -w /w \
            -v "$HOME/.m2":/root/.m2 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            eclipse-temurin:25.0.4_7-jdk-alpine \
            ./mvnw -B -ntp verify

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image
        run: docker build -t teaterihuskvarna:${{ github.sha }} .
