# Builds and tests the application. Everything runs through docker, so CI uses
# the same pinned JDK and PostgreSQL images a developer does:
# docs/decisions/0011-maven-and-the-build-in-a-container.md.
#
# Integration tests (*IT) run here rather than inside the image build, because
# Testcontainers needs a docker daemon and a build stage has none.
#
# `verify` is also what runs SpotBugs and PMD. Checkstyle is bound to `validate`,
# so the image job below runs that one too:
# docs/decisions/0013-three-static-analysis-gates.md.
name: build

# A commit on a pull request's branch would otherwise run twice, once for the
# push and once for the pull request. A branch gets CI once it has a pull
# request: docs/decisions/0020-pull-requests-and-merging.md.
on:
  push:
    branches: [main]
  pull_request:

# Read the repository and nothing else. No job here writes to GitHub, so a
# compromised action gets a token that cannot push or change anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Maven's downloads from the last run. With TEATERIHUSKVARNA_CACHE set,
      # scripts/maven.sh keeps them in that directory instead of a docker
      # volume, which a runner throws away. A pom.xml or wrapper change starts
      # from the newest older cache and saves a new one when the job succeeds.
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/maven-cache/.m2
          key: maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-
      - name: Tests and static analysis
        run: sh scripts/maven.sh verify
        env:
          TEATERIHUSKVARNA_CACHE: ${{ runner.temp }}/maven-cache
      - name: Pinned Temurin versions agree
        run: sh scripts/check-pins.sh
      - name: Prove nullability compiler enforcement
        run: sh scripts/check-nullability.sh
        env:
          TEATERIHUSKVARNA_CACHE: ${{ runner.temp }}/maven-cache

  # Beside test rather than after it: the two share nothing, and waiting added
  # the image build's minute to every run. Whatever later publishes the image
  # has to need both.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image
        run: docker build --build-context git=.git -t teaterihuskvarna:${{ github.sha }} .
