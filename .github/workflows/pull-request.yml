# Fails a pull request that closes no issue. Merging a pull request closes the
# issues GitHub links to it, and that moves the card to Done on the board. The
# label no-issue exempts one: docs/decisions/0020-pull-requests-and-merging.md.
#
# It asks GitHub which issues the pull request closes rather than searching the
# description, so it agrees with what the merge will actually do. An issue
# linked by hand under Development counts, but linking one does not rerun this;
# edit the description or push to rerun it.
#
# It asks for the labels as well, rather than reading them from the event. A
# pull request that gets its labels just after it opens, as Dependabot's do,
# fires several runs at once, and a run whose event predates the no-issue label
# could otherwise finish last and fail the check. Only the newest run per pull
# request is kept.
name: pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closes-an-issue:
    runs-on: ubuntu-latest
    steps:
      - name: The pull request closes an issue, or carries no-issue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The $ names are GraphQL variables, not shell ones.
          # shellcheck disable=SC2016
          pr=$(gh api graphql -F owner="$OWNER" -F repo="$REPO" -F number="$NUMBER" -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  labels(first: 50) { nodes { name } }
                  closingIssuesReferences(first: 10) { nodes { number } }
                }
              }
            }' --jq '.data.repository.pullRequest')
          if [ "$(echo "$pr" | jq '[.labels.nodes[].name] | index("no-issue") != null')" = true ]; then
            echo "Labelled no-issue."
            exit 0
          fi
          closes=$(echo "$pr" | jq -r '[.closingIssuesReferences.nodes[].number | "#\(.)"] | join(" ")')
          if [ -z "$closes" ]; then
            echo "::error::This pull request closes no issue. Add 'Closes #<number>' with your issue's number to the description."
            exit 1
          fi
          echo "Closes $closes."
