# Fixed Swedish copy. Editable content lives in Sanity instead.
# docs/decisions/0001-language-policy.md
#
# Checkstyle reads this file too, so a line over 120 characters fails the build.
# End a line with a backslash to continue a value on the next one.
#
# A key read with arguments goes through java.text.MessageFormat, where a literal
# apostrophe is written '' and {0} is the first argument. A key read without
# arguments comes back exactly as written, so a single ' there stays single. That
# is Spring's default (alwaysUseMessageFormat is false). Validation messages are
# read without arguments.

