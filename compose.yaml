# One compose file for local and production, per docs/decisions/0008. What
# differs between them is the env file and SITE_ADDRESS, not this file.

services:
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      # Local default is plain HTTP. Setting this to a hostname in production
      # makes Caddy obtain and renew a Let's Encrypt certificate on its own.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PROXY_HTTP_PORT:-8000}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    build: .
    image: ${APP_IMAGE:-teaterihuskvarna:dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-teaterihuskvarna}
      DATABASE_USER: ${POSTGRES_USER:-teaterihuskvarna}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    depends_on:
      db:
        condition: service_healthy

  db:
    # Pinned, and the same tag the tests run against: docs/decisions/0007.
    image: postgres:18.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teaterihuskvarna}
      POSTGRES_USER: ${POSTGRES_USER:-teaterihuskvarna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    # A named volume, not the container layer, so a deployment cannot take the
    # member register with it: docs/decisions/0008.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teaterihuskvarna} -d ${POSTGRES_DB:-teaterihuskvarna}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
