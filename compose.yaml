# The production stack. Local development loads compose.dev.yaml on top of this
# file, through COMPOSE_FILE in .env.example: docs/decisions/0008.

services:
  proxy:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      # Routes come from labels on the services below. Only a container that
      # sets traefik.enable gets one.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      # Every router on websecure gets a Let's Encrypt certificate for the host
      # in its rule, obtained and renewed by Traefik.
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ":ro" makes the file read-only, not the API. Whoever controls Traefik
      # controls the host. Accepted on 2026-09-23: docs/decisions/0008.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificates:/certificates
    depends_on:
      - app

  app:
    build:
      context: .
      # The git directory, which the Dockerfile's git stage explains. In a git
      # worktree the post-checkout hook sets both variables in .env.
      additional_contexts:
        git: ${BUILD_GIT_DIR:-.git}
      args:
        BUILD_GIT_WORKTREE: ${BUILD_GIT_WORKTREE:-}
    image: ${APP_IMAGE:-teaterihuskvarna:dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-teaterihuskvarna}
      DATABASE_USER: ${POSTGRES_USER:-teaterihuskvarna}
      # No default, so production cannot start on a password written in this
      # file. Local development sets one in .env like any other value.
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Brevo's relay and credentials: docs/decisions/0005. The dev profile
      # ignores these and sends to Mailpit.
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_LOGIN: ${SMTP_LOGIN:-}
      SMTP_KEY: ${SMTP_KEY:-}
      # No defaults. Without the dev profile the application refuses to start
      # while any of the first three is empty: docs/decisions/0015.
      SITE_URL: ${SITE_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BANKGIRO: ${BANKGIRO:-}
      FIRST_ADMINISTRATOR_EMAIL: ${FIRST_ADMINISTRATOR_EMAIL:-}
      FIRST_ADMINISTRATOR_NAME: ${FIRST_ADMINISTRATOR_NAME:-}
      # The public content: docs/decisions/0021. The dev profile reads a
      # fixture instead unless CONTENT_SOURCE is sanity.
      CONTENT_SOURCE: ${CONTENT_SOURCE:-}
      SANITY_PROJECT_ID: ${SANITY_PROJECT_ID:-}
      SANITY_DATASET_NAME: ${SANITY_DATASET_NAME:-}
      SANITY_API_KEY: ${SANITY_API_KEY:-}
      SANITY_WEBHOOK_SECRET: ${SANITY_WEBHOOK_SECRET:-}
      SANITY_STUDIO_URL: ${SANITY_STUDIO_URL:-}
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: Host(`${SITE_HOST:-}`)
      traefik.http.routers.app.entrypoints: websecure
      traefik.http.services.app.loadbalancer.server.port: "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    # Pinned, and the same tag the tests run against: docs/decisions/0007.
    image: postgres:18.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teaterihuskvarna}
      POSTGRES_USER: ${POSTGRES_USER:-teaterihuskvarna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teaterihuskvarna} -d ${POSTGRES_DB:-teaterihuskvarna}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  certificates:
